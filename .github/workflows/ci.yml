name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa8f9c6aa88f1be188e # v4.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@d156388eb19633375bd311914445ead649371ba8 # v4.2.0
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Create compile-only Firebase configuration
        run: |
          cat > androidApp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "tabakpp-ci-placeholder",
              "storage_bucket": "tabakpp-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:100000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.tabakpp.app" }
              },
              "api_key": [{ "current_key": "ci-placeholder-not-a-real-api-key" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Test shared code, Compose UI, and build Android
        run: ./gradlew :shared:testDebugUnitTest :composeApp:testDebugUnitTest :androidApp:lintDebug :androidApp:assembleDebug :androidApp:assembleRelease --no-daemon

  web-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa8f9c6aa88f1be188e # v4.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@1e60f620b724f1477f86493fde0f6dd90b57a88e # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webApp/package-lock.json
      - name: Install locked dependencies
        working-directory: webApp
        run: npm ci
      - name: Lint, test, and build
        working-directory: webApp
        run: npm run lint && npm run audit:prod && npm run coverage && npm run build
      - name: Test Firestore rules
        working-directory: webApp
        run: npm run test:rules
