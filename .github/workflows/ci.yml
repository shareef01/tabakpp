name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-action-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webApp/package-lock.json
      - name: Validate GitHub Action pins
        run: python3 .github/scripts/validate-action-pins.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Create compile-only Firebase configuration
        run: |
          cat > androidApp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "tabakpp-ci-placeholder",
              "storage_bucket": "tabakpp-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:100000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.tabakpp.app" }
              },
              "api_key": [{ "current_key": "ci-placeholder-not-a-real-api-key" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
      # DomainContractFixturesTest (shared/src/androidUnitTest) runs as part of
      # :shared:testDebugUnitTest — the same shared-tests/domain-fixtures.json
      # the web job checks below, so this job fails on its own if the Kotlin
      # port drifts from the JS one (item 11).
      - name: Test shared code, Compose UI, and build Android
        run: ./gradlew :shared:testDebugUnitTest :composeApp:testDebugUnitTest :androidApp:lintDebug :androidApp:assembleDebug :androidApp:assembleRelease --no-daemon

  web-and-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webApp/package-lock.json
      - name: Install locked dependencies
        working-directory: webApp
        run: npm ci
      - name: Lint, test, and build
        working-directory: webApp
        run: npm run lint && npm run audit:prod && npm run coverage && npm run build
      # Cross-platform domain contract fixtures (item 11) — see
      # shared-tests/README.md. Also covered by `npm run test:run` above, but
      # named explicitly so a fixture-only regression is easy to spot in logs.
      - name: Cross-platform domain contract fixtures
        working-directory: webApp
        run: npm run test:contract
      - name: Test Firestore rules
        working-directory: webApp
        run: npm run test:rules
