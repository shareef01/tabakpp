name: Android Instrumentation Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          # Gradle User Home caching is already owned by actions/setup-java
          # (`cache: gradle`) above. Upstream docs advise against running both
          # cache owners, as they can interfere with each other. `external` tells
          # setup-gradle to skip its own Gradle User Home save/restore (and so
          # avoid the proprietary `enhanced` provider) while keeping its
          # non-caching functionality.
          cache-provider: external

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Node.js (for Firebase CLI + web tests)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: webApp/package-lock.json

      - name: Pin npm to canonical version
        run: npm install -g npm@10.9.8

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.24.0

      - name: Install web dependencies
        working-directory: webApp
        run: npm ci

      # --- Web emulator tests (rules + emulator-backed service tests) ---
      # `npm run test:rules` uses `firebase emulators:exec` (self-contained:
      # starts Firestore, runs vitest.rules.config.js, then shuts down).
      # vitest.rules.config.js includes *.rules.test.js (35 cases) and
      # *.emulator.test.js (22 + 2 = 24 cases), for 59 total.
      - name: Run Firestore rules and emulator-backed Web tests
        working-directory: webApp
        run: |
          npm run test:rules

      # --- Android instrumentation tests ---
      # google-services.json is required by the com.google.gms.google-services
      # plugin (applied via gradle/libs.versions.toml). It must live in the
      # `debug` source set (NOT androidTest), because processDebugGoogleServices
      # only searches src/debug/, src/, and the project root.
      - name: Create demo project google-services.json for Android test
        run: |
          mkdir -p androidApp/src/debug
          cat > androidApp/src/debug/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "demo-tabakpp-test",
              "storage_bucket": "demo-tabakpp-test.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.tabakpp.app" }
              },
              "api_key": [{ "current_key": "ci-test-only-not-a-real-api-key" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON

      # Clear stale results from prior runs so artifacts reflect only this run's tests.
      - name: Clear stale Android test results
        run: rm -rf androidApp/build/outputs/androidTest-results/

      # Pre-build the test APKs BEFORE booting the emulator. The Gradle build
      # (Kotlin compile + dex) is CPU-intensive and running it concurrently
      # with the Android emulator causes the emulator to crash
      # ('cmd: Can't find service: package' / system_server restart).
      # With APKs pre-built, connectedDebugAndroidTest skips straight to
      # install + run, eliminating the build-vs-emulator resource contention.
      - name: Pre-build test APKs
        run: |
          ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest \
            --no-daemon \
            --quiet
      - name: Create instrumentation test script
        run: |
          cat > ci-run-tests.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          # Target the single emulator we launched explicitly, so no adb call
          # can resolve to a different (or absent) device.
          export ANDROID_SERIAL=emulator-5554

          # Start Firebase emulators in the background.
          # Create a CI-specific config that binds emulators to 0.0.0.0 instead
          # of 127.0.0.1, because the Android emulator's 10.0.2.2 alias for the
          # host loopback is intermittently unreachable on CI runners (ENETUNREACH).
          # Binding to 0.0.0.0 makes emulators reachable via any interface,
          # including the emulator's network bridge.
          cat > firebase.ci.json <<'JSON'
          {
            "firestore": {
              "rules": "firestore.rules"
            },
            "emulators": {
              "firestore": { "port": 8080, "host": "0.0.0.0" },
              "auth": { "port": 9099, "host": "0.0.0.0" },
              "ui": { "enabled": false }
            }
          }
          JSON
          firebase emulators:start --config firebase.ci.json --only firestore,auth --project demo-tabakpp-test > firebase-emulator.log 2>&1 &
          FIREBASE_PID=$!
          # LOGCAT_PID is only assigned later; readiness failures exit before that.
          # ${LOGCAT_PID:-} avoids an unbound-variable error under `set -u`
          # that would otherwise mask the real infrastructure error.
          trap 'kill "$FIREBASE_PID" 2>/dev/null || true; pkill -f cloud-firestore 2>/dev/null || true; kill "${LOGCAT_PID:-}" 2>/dev/null || true' EXIT

          # Wait for Firestore emulator readiness (30 retries × 2s = 60s max)
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080 > /dev/null 2>&1; then
              echo "Firestore emulator is ready"
              break
            fi
            sleep 2
          done

          # Wait for Auth emulator readiness (30 retries × 2s = 60s max)
          for i in $(seq 1 30); do
            if curl -s http://localhost:9099 > /dev/null 2>&1; then
              echo "Auth emulator is ready"
              break
            fi
            sleep 2
          done

          # Fail fast if emulators never came up
          if ! curl -s http://localhost:8080 > /dev/null 2>&1; then
            echo "::error::Firestore emulator failed to start"
            cat firebase-emulator.log
            exit 1
          fi
          if ! curl -s http://localhost:9099 > /dev/null 2>&1; then
            echo "::error::Auth emulator failed to start"
            cat firebase-emulator.log
            exit 1
          fi

          # ---------------------------------------------------------------------
          # Android device readiness (#74)
          #
          # sys.boot_completed == 1 alone is NOT sufficient. ddmlib reads device
          # properties with `adb shell getprop`; when the shell is still
          # unresponsive it throws ShellCommandUnresponsiveException and AGP
          # reports:
          #     Skipping device 'test_emulator(AVD)': Unknown API Level
          #     : No compatible devices connected.
          #     Found 1 connected device(s), 0 of which were compatible.
          # ...even though adb lists the device and boot_completed is 1.
          #
          # ICMP is NOT a valid readiness signal: `ping` uses a raw socket and
          # bypasses the adbd/shell path that ddmlib depends on, so it succeeds
          # on a device whose shell is wedged.
          #
          # Require device state, a real getprop round-trip, the package
          # manager and the settings service — for N consecutive probes.
          dump_device_evidence() {
          {
          echo "=== timestamp ==="
          date -u +"%Y-%m-%dT%H:%M:%SZ"
          echo "=== adb devices -l ==="
          adb devices -l 2>&1 || true
          echo "=== adb get-state ==="
          adb get-state 2>&1 || true
          echo "=== selected getprop ==="
          adb shell getprop ro.build.version.sdk 2>&1 || true
          adb shell getprop ro.product.cpu.abi 2>&1 || true
          adb shell getprop ro.product.cpu.abilist 2>&1 || true
          adb shell getprop ro.product.model 2>&1 || true
          adb shell getprop sys.boot_completed 2>&1 || true
          echo "=== adb reverse --list ==="
          adb reverse --list 2>&1 || true
          echo "=== load ==="
          adb shell cat /proc/loadavg 2>&1 || true
          } > adb-device-evidence.txt 2>&1 || true
          cat adb-device-evidence.txt || true
          }

          fail_readiness() {
          echo "::error::$1"
          dump_device_evidence
          exit 1
          }

          # Per-command bound: a single `adb shell` can hang indefinitely while
          # the device is mid-boot, stalling the whole probe loop and defeating
          # the bounded retry budget.
          ADB_SHELL_TIMEOUT=20
          adb_shell_ok() {
            timeout -k 5 "$ADB_SHELL_TIMEOUT" adb shell "$1" >/dev/null 2>&1
          }
          adb_prop() {
            timeout -k 5 "$ADB_SHELL_TIMEOUT" adb shell "getprop $1" 2>/dev/null | tr -d '[:space:]' || true
          }

          # The budget must outlast the emulator boot itself: observed boots are
          # 341-606s, and `adb get-state` succeeds long before
          # sys.boot_completed flips to 1. A budget shorter than boot would
          # expire before the device could ever become ready.
          READINESS_PROBES=160
          STABLE_REQUIRED=3
          stable=0
          for probe in $(seq 1 "$READINESS_PROBES"); do
            ok=1
            state="$(adb get-state 2>/dev/null | tr -d '[:space:]' || true)"
            [ "$state" = "device" ] || ok=0

            boot=""
            if [ "$ok" = "1" ]; then
              boot="$(adb_prop sys.boot_completed)"
              [ "$boot" = "1" ] || ok=0
            fi

            # API level must be readable AND numeric, so a device that answers
            # with empty output or error text cannot look ready.
            sdk=""
            if [ "$ok" = "1" ]; then
              sdk="$(adb_prop ro.build.version.sdk)"
              case "$sdk" in
                ''|*[!0-9]*) ok=0 ;;
              esac
            fi

            if [ "$ok" = "1" ] && ! adb_shell_ok "pm list packages"; then ok=0; fi
            if [ "$ok" = "1" ] && ! adb_shell_ok "settings get global window_animation_scale"; then ok=0; fi

            if [ "$ok" = "1" ]; then
              stable=$((stable + 1))
              echo "DEVICE_READY: consecutive probe $stable/$STABLE_REQUIRED (sdk=$sdk)"
              if [ "$stable" -ge "$STABLE_REQUIRED" ]; then break; fi
            else
              stable=0
              echo "DEVICE_NOT_READY (probe $probe/$READINESS_PROBES): state='$state' boot_completed='$boot' sdk='$sdk'"
            fi
            sleep 5
          done

          if [ "$stable" -lt "$STABLE_REQUIRED" ]; then
          fail_readiness "DEVICE_NOT_READY: device never satisfied $STABLE_REQUIRED consecutive readiness probes (adb shell, package manager, settings service)"
          fi
          echo "DEVICE_READY: shell, package manager and settings service all responsive"
          # Always capture device evidence, not only on failure, so a green run
          # still records the exact API level / ABI / reverse mapping used.
          dump_device_evidence

          # Forward emulator 127.0.0.1 to host localhost for the Firebase
          # emulator ports. The emulator's 10.0.2.2 loopback alias has
          # unreliable IPv6 routing on CI runners (ENETUNREACH); adb reverse
          # routes through 127.0.0.1 (IPv4-only loopback) instead.
          adb reverse tcp:8080 tcp:8080
          adb reverse tcp:9099 tcp:9099

          # Verify the reverse tunnels are actually registered. This was never
          # checked before, so a silently-dropped tunnel reached Gradle.
          REVERSE_LIST="$(adb reverse --list 2>/dev/null || true)"
          case "$REVERSE_LIST" in
          *tcp:8080*) ;;
          *) fail_readiness "ADB_REVERSE_MISSING: tcp:8080 not present in adb reverse --list" ;;
          esac
          case "$REVERSE_LIST" in
          *tcp:9099*) ;;
          *) fail_readiness "ADB_REVERSE_MISSING: tcp:9099 not present in adb reverse --list" ;;
          esac
          echo "ADB_REVERSE_OK:"
          echo "$REVERSE_LIST"

          # Real TCP reachability probe through the reverse tunnel.
          #
          # The previous probe was `adb shell "ping -c1 -W2 127.0.0.1"`, which
          # (a) is ICMP to the emulator's own loopback and never traverses
          # tcp:8080/tcp:9099, and (b) succeeds even when the adb shell is
          # unresponsive. It was a false positive on every run.
          PROBE_TOOL=""
          probe_port() {
          # Redirect stdin from /dev/null so nc observes EOF immediately
          # after connecting and exits 0 on success. Without this, adb shell
          # keeps stdin open, nc blocks for the full -w timeout and then
          # exits NON-ZERO even though the TCP connection succeeded — which
          # would hard-fail a healthy runner as EMULATOR_PORT_UNREACHABLE.
          if adb shell "toybox nc -w 3 127.0.0.1 $1 < /dev/null" >/dev/null 2>&1; then
          PROBE_TOOL="toybox-nc"
          return 0
          fi
          if adb shell "nc -w 3 -z 127.0.0.1 $1" >/dev/null 2>&1; then
          PROBE_TOOL="nc"
          return 0
          fi
          return 1
          }

          for port in 8080 9099; do
          reachable=0
          for attempt in $(seq 1 10); do
          if probe_port "$port"; then reachable=1; break; fi
          echo "Waiting for emulator TCP reachability on 127.0.0.1:$port ($attempt/10)..."
          sleep 3
          done
          if [ "$reachable" -eq 1 ]; then
          echo "TCP_PROBE_OK: 127.0.0.1:$port reachable from emulator via $PROBE_TOOL through adb reverse"
          else
          if adb shell 'command -v toybox >/dev/null 2>&1 || command -v nc >/dev/null 2>&1'; then
          fail_readiness "EMULATOR_PORT_UNREACHABLE: 127.0.0.1:$port not reachable from inside the emulator despite adb reverse being registered"
          else
          echo "::warning::TCP_PROBE_UNVERIFIED: no nc or toybox on this emulator image, so 127.0.0.1:$port could not be probed. adb reverse --list was verified; runtime connectivity is asserted by the test fixture."
          fi
          fi
          done

          # Warm up the Auth emulator's sign-in endpoint. The first
          # signInAnonymously request to a freshly-started Auth emulator can
          # take >30s while it initializes token-signing infrastructure on
          # cold start. Pre-warming with a direct API call ensures the
          # emulator is fully ready before the test suite's first @Before
          # setup() runs. Using --max-time 90 to allow for the cold start.
          echo "Warming up Firebase Auth emulator (sign-in cold start)..."
          curl --max-time 90 -s -X POST "http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1/accounts:signInAnonymously?key=test" \
            -H "Content-Type: application/json" \
            -d '{"returnSecureToken": true}' > /dev/null 2>&1 || true
          echo "Auth emulator warm-up complete"

          # Capture logcat during test execution — critical for diagnosing hangs
          adb logcat -c
          ( adb logcat -v threadtime > test-logcat.log 2>&1 ) &
          LOGCAT_PID=$!

          # Run Android instrumentation tests — full androidTest suite.
          # No -Pandroid.testInstrumentationRunnerArguments.class filter: AndroidJUnitRunner
          # discovers all androidTest classes automatically (currently FirebaseRegistryRepositoryTest
          # + RegistryErrorStructuredCodeTest = 21 tests). This keeps CI in sync with the
          # complete intended suite and automatically includes future androidTest classes.
          # timeout=120: per-test timeout (via AndroidJUnitRunner) catches hanging @Before/setup
          # timeout -k 30s 30m: hard kill if tests hang beyond 30 min (well under 45m job limit;
          # bumped from 20m → 30m to accommodate slow CI emulator boots: 21 androidTest tests
          # can take up to ~15 min on a cold emulator, plus ~6-7 min APK install)
          TEST_EXIT=0
          timeout -k 30s 30m ./gradlew :androidApp:connectedDebugAndroidTest \
            --no-daemon \
            -Pandroid.testInstrumentationRunnerArguments.debug=false \
            -Pandroid.testInstrumentationRunnerArguments.timeout=120 \
            || TEST_EXIT=$?

          # Stop logcat capture
          kill "$LOGCAT_PID" 2>/dev/null || true

          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "::error::Instrumentation tests failed (exit code: $TEST_EXIT)"
            echo ""
            echo "=== CI failure diagnostics ==="
            echo ""
            echo "--- test-logcat.log: AUTH_ lines ---"
            grep -i "AUTH_\|Signed in as\|AUTH_SETUP_FAILED\|AUTH_UID_MISMATCH\|test\.uid" test-logcat.log 2>/dev/null || echo "(none)"
            echo ""
            echo "--- test-logcat.log: contention phase markers ---"
            grep -i "CONTENTION_PHASE=" test-logcat.log 2>/dev/null || echo "(none)"
            echo ""
            echo "--- test-logcat.log: Contention summary ---"
            grep -i "Contention (" test-logcat.log 2>/dev/null || echo "(none)"
            echo ""
            echo "--- test-logcat.log: final count ---"
            grep -i "Final count:" test-logcat.log 2>/dev/null || echo "(none)"
            echo ""
            echo "--- test-logcat.log: PERMISSION_DENIED ---"
            grep -i "PERMISSION_DENIED" test-logcat.log 2>/dev/null || echo "(none)"
            echo ""
            echo "--- test-logcat.log: FAILED_PRECONDITION ---"
            grep -i "FAILED_PRECONDITION" test-logcat.log 2>/dev/null || echo "(none)"
            echo ""
            echo "--- test-logcat.log: ABORTED ---"
            grep -i "ABORTED" test-logcat.log 2>/dev/null || echo "(none)"
            echo ""
            echo "--- firebase-debug.log: PERMISSION_DENIED ---"
            grep -i "PERMISSION_DENIED" firestore-debug.log 2>/dev/null || echo "(none or not present)"
            echo ""
            echo "--- firebase-debug.log: permissionTracesAsJsonArray ---"
            grep -i "permissionTracesAsJsonArray" firestore-debug.log 2>/dev/null || echo "(none or not present)"
            echo ""
            echo "--- firebase-debug.log: ArrayIndexOutOfBoundsException ---"
            grep -i "ArrayIndexOutOfBoundsException" firestore-debug.log 2>/dev/null || echo "(none or not present)"
            echo ""
            echo "--- firebase-debug.log: rules evaluation failures ---"
            grep -i "rules evaluation\|RulesEvaluation\|false for" firestore-debug.log 2>/dev/null || echo "(none or not present)"
            echo ""
            echo "--- firebase-emulator.log: PERMISSION_DENIED ---"
            grep -i "PERMISSION_DENIED" firebase-emulator.log 2>/dev/null || echo "(none)"
            echo ""
            echo "--- firebase-emulator.log: permissionTracesAsJsonArray ---"
            grep -i "permissionTracesAsJsonArray" firebase-emulator.log 2>/dev/null || echo "(none)"
            echo ""
            echo "--- firebase-emulator.log: ArrayIndexOutOfBoundsException ---"
            grep -i "ArrayIndexOutOfBoundsException" firebase-emulator.log 2>/dev/null || echo "(none)"
            echo ""
            echo "--- firebase-emulator.log: rules evaluation failures ---"
            grep -i "rules evaluation\|RulesEvaluation\|false for" firebase-emulator.log 2>/dev/null || echo "(none)"
            echo ""
            echo "=== Full Firebase emulator log ==="
            cat firebase-emulator.log
            echo ""
            echo "=== Test logcat (last 200 lines) ==="
            tail -200 test-logcat.log 2>/dev/null || echo "No logcat available"
            exit "$TEST_EXIT"
          fi

          echo "Instrumentation tests passed"
          exit 0
          SCRIPT
          chmod +x ci-run-tests.sh

      # The workflow now owns the emulator lifecycle end-to-end instead of
      # delegating to reactivecircus/android-emulator-runner.
      #
      # Why: the action treats `sys.boot_completed == 1` as sufficient device
      # readiness and then immediately runs shell-dependent commands —
      # unconditionally `adb shell input keyevent 82`, plus `settings put ...`
      # when animations are disabled. On a slow software-emulated AVD those
      # services are still unstable, producing Broken pipe (32) and adb exit
      # 224. The action then aborts BEFORE `script:` is invoked, so a readiness
      # gate inside ci-run-tests.sh can never run. Observed in run 37253333090:
      #
      #   Emulator booted.
      #   adb shell input keyevent 82
      #   Boot completed in 437842 ms
      #   cmd: Failure calling service input: Broken pipe (32)
      #   ##[error] ... adb ... failed with exit code 224
      #
      # Owning launch + readiness puts the stable-probe gate before the first
      # fragile service interaction.
      - name: Set up emulator and run instrumentation tests
        run: |
          set -euo pipefail

          # --- SDK / AVD setup (parity with the previous wrapper) ---
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install 'build-tools;37.0.0' platform-tools 'platforms;android-35' > /dev/null
          sdkmanager --install emulator --channel=0 > /dev/null
          sdkmanager --install 'system-images;android-35;default;x86_64' --channel=0 > /dev/null

          echo no | avdmanager create avd --force -n test_emulator \
            --package 'system-images;android-35;default;x86_64' > /dev/null
          printf 'hw.cpu.ncore=2\n' >> "$HOME/.android/avd/test_emulator.avd/config.ini"

          # --- Acceleration: decide explicitly and record it ---
          ACCEL_ARGS=""
          if [ -w /dev/kvm ]; then
            echo "ACCELERATION: /dev/kvm writable, using hardware acceleration"
          else
            echo "ACCELERATION: /dev/kvm not available to this user, using software emulation (-accel off)"
            ACCEL_ARGS="-accel off"
          fi

          echo "Launching emulator: emulator -port 5554 -avd test_emulator -no-snapshot -no-audio -no-window -no-boot-anim -gpu swiftshader_indirect $ACCEL_ARGS"
          nohup emulator -port 5554 -avd test_emulator \
            -no-snapshot -no-audio -no-window -no-boot-anim -gpu swiftshader_indirect \
            $ACCEL_ARGS > emulator-launch.log 2>&1 &
          EMULATOR_PID=$!
          echo "Emulator launched (pid $EMULATOR_PID)"

          cleanup_emulator() {
            adb -s emulator-5554 emu kill > /dev/null 2>&1 || true
            if [ -n "${EMULATOR_PID:-}" ]; then
              kill "$EMULATOR_PID" > /dev/null 2>&1 || true
              wait "$EMULATOR_PID" 2>/dev/null || true
            fi
          }
          trap cleanup_emulator EXIT

          ./ci-run-tests.sh

      # Upload test result artifacts from BOTH runs.
      # No test re-execution — just collect what the test steps already produced.
      # Artifact names are attempt-specific to avoid ambiguity on reruns.
      # Artifact names use the actual PR source head SHA (or the push commit SHA
      # for push events) so forensic identity matches the commit under review.
      # github.event.pull_request.head.sha is the PR's actual source commit;
      # github.sha is the workflow merge commit (for pull_request events) or the
      # push commit (for push events). We prefer the source head when available.
      - name: Generate CI test metadata
        if: always()
        run: |
          SOURCE_HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          cat > ci-test-metadata.txt <<EOF
          github.run_id=${{ github.run_id }}
          github.run_attempt=${{ github.run_attempt }}
          workflow_sha=${{ github.sha }}
          source_head_sha=$SOURCE_HEAD_SHA
          github.ref=${{ github.ref }}
          github.head_ref=${{ github.head_ref || '' }}
          github.base_ref=${{ github.base_ref || '' }}
          workflow_name=${{ github.workflow }}
          runner_os=${{ runner.os }}
          java_version=$(java -version 2>&1 | head -1)
          firebase_cli_version=$(firebase --version 2>/dev/null || echo "not installed")
          android_api_level=35
          emulator_avd_name=test_emulator
          metadata_generated_at_utc=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: instrumentation-${{ github.event.pull_request.head.sha || github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          retention-days: 30
          path: |
            androidApp/build/outputs/androidTest-results/
            webApp/test-results/
            # Connected-test reports (if generated)
            androidApp/build/reports/androidTests/connected/
            # Debug artifacts from the test job only
            firebase-emulator.log
            firestore-debug.log
            test-logcat.log
            adb-device-evidence.txt
            ci-test-metadata.txt
