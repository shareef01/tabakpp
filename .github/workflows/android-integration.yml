name: Android Instrumentation Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Node.js (for Firebase CLI + web tests)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: webApp/package-lock.json

      - name: Pin npm to canonical version
        run: npm install -g npm@10.9.8

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install web dependencies
        working-directory: webApp
        run: npm ci

      # --- Web emulator tests (rules + emulator-backed service tests) ---
      # `npm run test:rules` uses `firebase emulators:exec` (self-contained:
      # starts Firestore, runs vitest.rules.config.js, then shuts down).
      # vitest.rules.config.js includes *.rules.test.js (35 cases) and
      # *.emulator.test.js (22 + 2 = 24 cases), for 59 total.
      - name: Run Firestore rules and emulator-backed Web tests
        working-directory: webApp
        run: |
          npm run test:rules

      # --- Android instrumentation tests ---
      # google-services.json is required by the com.google.gms.google-services
      # plugin (applied via gradle/libs.versions.toml). It must live in the
      # `debug` source set (NOT androidTest), because processDebugGoogleServices
      # only searches src/debug/, src/, and the project root.
      - name: Create demo project google-services.json for Android test
        run: |
          mkdir -p androidApp/src/debug
          cat > androidApp/src/debug/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "demo-tabakpp-test",
              "storage_bucket": "demo-tabakpp-test.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.tabakpp.app" }
              },
              "api_key": [{ "current_key": "ci-test-only-not-a-real-api-key" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON

      # Clear stale results from prior runs so artifacts reflect only this run's tests.
      - name: Clear stale Android test results
        run: rm -rf androidApp/build/outputs/androidTest-results/

      # Write the instrumentation test runner as a standalone script so it
      # executes in a single shell (the emulator-runner action runs each line
      # of `script` as a separate sh -c, which breaks PID/trap/loops).
      - name: Create instrumentation test script
        run: |
          cat > ci-run-tests.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          # Start Firebase emulators in the background
          firebase emulators:start --config firebase.json --only firestore,auth --project demo-tabakpp-test > firebase-emulator.log 2>&1 &
          FIREBASE_PID=$!
          trap 'kill $FIREBASE_PID 2>/dev/null; pkill -f "firebase.*emulator" 2>/dev/null; pkill -f cloud-firestore 2>/dev/null' EXIT

          # Wait for Firestore emulator readiness (30 retries × 2s = 60s max)
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080 > /dev/null 2>&1; then
              echo "Firestore emulator is ready"
              break
            fi
            sleep 2
          done

          # Fail fast if emulator never came up
          if ! curl -s http://localhost:8080 > /dev/null 2>&1; then
            echo "::error::Firestore emulator failed to start"
            cat firebase-emulator.log
            exit 1
          fi

          # Run Android instrumentation tests (no || true — failures propagate)
          ./gradlew :androidApp:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.tabakpp.app.firestore.FirebaseRegistryRepositoryTest \
            --no-daemon \
            -Pandroid.testInstrumentationRunnerArguments.debug=false
          SCRIPT
          chmod +x ci-run-tests.sh

      # The emulator-runner action (v2) starts the Android emulator, runs the
      # `script`, then stops the emulator. Firebase emulators are started/stopped
      # inside ci-run-tests.sh via background PID + trap for deterministic cleanup.
      - name: Boot Android emulator and run instrumentation tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          emulator-options: -no-snapshot -no-audio -no-window -no-boot-anim -gpu swiftshader_indirect
          force-avd-creation: true
          avd-name: test_emulator
          script: ./ci-run-tests.sh

      # Upload test result artifacts from BOTH runs.
      # No test re-execution — just collect what the test steps already produced.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            androidApp/build/outputs/androidTest-results/
            webApp/test-results/
