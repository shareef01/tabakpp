name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag format
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag '${{ github.ref_name }}' does not match required format 'vMAJOR.MINOR.PATCH'"
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Missing secret GOOGLE_SERVICES_JSON_BASE64"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > androidApp/google-services.json

      - name: Decode release keystore
        env:
          TABAKPP_KEYSTORE_BASE64: ${{ secrets.TABAKPP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TABAKPP_KEYSTORE_BASE64" ]; then
            echo "Missing secret TABAKPP_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$TABAKPP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tabakpp-release.keystore"
          echo "TABAKPP_KEYSTORE_PATH=$RUNNER_TEMP/tabakpp-release.keystore" >> "$GITHUB_ENV"

      - name: Run test and lint validation suite
        run: ./gradlew :shared:testDebugUnitTest :composeApp:testDebugUnitTest :androidApp:lintDebug --no-daemon

      - name: Assemble signed release APK
        env:
          TABAKPP_KEYSTORE_PASSWORD: ${{ secrets.TABAKPP_KEYSTORE_PASSWORD }}
          TABAKPP_KEY_ALIAS: ${{ secrets.TABAKPP_KEY_ALIAS }}
          TABAKPP_KEY_PASSWORD: ${{ secrets.TABAKPP_KEY_PASSWORD }}
          # Tag drives versionName/versionCode (see androidApp/build.gradle.kts).
          TABAKPP_VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Stage release artifact
        run: |
          mkdir -p dist
          APK_PATH=$(find androidApp/build/outputs/apk/release -name "*release*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: No signed release APK found in androidApp/build/outputs/apk/release/"
            exit 1
          fi
          cp "$APK_PATH" "dist/tabakpp-${GITHUB_REF_NAME}.apk"

      # Verify the APK signature using SDK apksigner BEFORE generating checksum or publishing.
      - name: Verify the APK signature
        run: |
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "Error: apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "dist/tabakpp-${GITHUB_REF_NAME}.apk"

      - name: Generate artifact checksum
        run: |
          cd dist
          sha256sum "tabakpp-${GITHUB_REF_NAME}.apk" > "tabakpp-${GITHUB_REF_NAME}.apk.sha256"
          cd ..

      - name: Cleanup decoded credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/tabakpp-release.keystore"
          rm -f androidApp/google-services.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/tabakpp-*.apk
            dist/tabakpp-*.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
