name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Missing secret GOOGLE_SERVICES_JSON_BASE64"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > androidApp/google-services.json

      - name: Decode release keystore
        env:
          TABAKPP_KEYSTORE_BASE64: ${{ secrets.TABAKPP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TABAKPP_KEYSTORE_BASE64" ]; then
            echo "Missing secret TABAKPP_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$TABAKPP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tabakpp-release.keystore"
          echo "TABAKPP_KEYSTORE_PATH=$RUNNER_TEMP/tabakpp-release.keystore" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        env:
          TABAKPP_KEYSTORE_PASSWORD: ${{ secrets.TABAKPP_KEYSTORE_PASSWORD }}
          TABAKPP_KEY_ALIAS: ${{ secrets.TABAKPP_KEY_ALIAS }}
          TABAKPP_KEY_PASSWORD: ${{ secrets.TABAKPP_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/*.apk \
            "dist/tabakpp-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tabakpp-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
