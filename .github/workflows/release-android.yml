name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, e.g. 1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event.inputs.version }}

jobs:
  # Validation job: runs the full test+lint suite on the trusted
  # current main HEAD. Only if this passes does the release job
  # proceed. This job has NO access to release-environment secrets.
  #
  # The workflow is triggered by workflow_dispatch (manual dispatch from
  # the default branch), so the workflow definition is ALWAYS sourced from
  # the current default branch — the legitimate release path never
  # executes a historical workflow definition. However, historical tag-triggered
  # workflows in old commits STILL exist in Git history and can still execute
  # if a v* tag is created on an old commit. Their signing-secret access is
  # removed by migrating credentials to the protected 'release' environment
  # and deleting repository-level copies (see deployment notes).
  #
  # The release job always builds/tags the exact SHA validated here, even
  # if main advances between jobs — see the release job's checkout step.
  require-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha: ${{ steps.record.outputs.sha }}
      release_version: ${{ steps.validate-version.outputs.version }}

    steps:
      - name: Verify dispatch from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ERROR: Releases must be dispatched from main (got $GITHUB_REF)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0  # full history for provenance operations

      # Record the exact commit that will be validated and released.
      - name: Record release SHA
        id: record
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Release SHA: ${RELEASE_SHA}"

      # Validate version input format (same SemVer policy used by the app).
      - name: Test release input and acceptance guards
        run: python3 .github/scripts/test-release-safety.py

      - name: Validate version input
        id: validate-version
        run: |
          VERSION="$RELEASE_VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version '$VERSION' does not match required SemVer format 'MAJOR.MINOR.PATCH'"
            exit 1
          fi
          echo "Validated version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Reject if the tag already exists remotely.
      - name: Check tag does not already exist
        run: |
          VERSION="$RELEASE_VERSION"
          if git ls-remote --tags origin "v${VERSION}" | grep -q "v${VERSION}"; then
            echo "Error: Tag 'v${VERSION}' already exists remotely. Aborting release."
            exit 1
          fi
          echo "Tag v${VERSION} does not exist remotely — OK to proceed."

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webApp/package-lock.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      # CI uses a compile-only placeholder google-services.json; the release
      # job will decode the real one from environment secrets.
      - name: Create compile-only Firebase configuration
        run: |
          cat > androidApp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "tabakpp-ci-placeholder",
              "storage_bucket": "tabakpp-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:100000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.tabakpp.app" }
              },
              "api_key": [{ "current_key": "ci-placeholder-not-a-real-api-key" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Install web deps
        working-directory: webApp
        run: npm ci

      - name: Run full validation suite (mirrors ci.yml)
        run: |
          ./gradlew :shared:testDebugUnitTest :composeApp:testDebugUnitTest :androidApp:lintDebug :androidApp:assembleDebug :androidApp:assembleRelease --no-daemon
          cd webApp && npm run lint && npm run audit:prod && npm run test:run && npm run test:contract && npm run test:rules && npm run build && npm run test:pwa

      - name: Require exact-SHA main CI and Android instrumentation acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check-release-ci.py "${{ steps.record.outputs.sha }}"

      - name: Record validated SHA for release job
        run: |
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

  # Release job: runs ONLY on the protected 'release' environment and
  # ONLY AFTER require-ci passes. Has contents: write for creating
  # GitHub Release and tag.
  release:
    needs: require-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      RELEASE_VERSION: ${{ needs.require-ci.outputs.release_version }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Checkout the EXACT validated SHA from require-ci, not whatever
          # main happens to contain later. This prevents a race where main
          # advances between validation and signing.
          ref: ${{ needs.require-ci.outputs.release_sha }}
          fetch-depth: 0

      - name: Validate release tag format
        run: |
          VERSION="$RELEASE_VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version '$VERSION' does not match required SemVer format 'MAJOR.MINOR.PATCH'"
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          # Gradle User Home caching is already owned by actions/setup-java
          # (`cache: gradle`) above. Upstream docs advise against running both
          # cache owners, as they can interfere with each other. `external` tells
          # setup-gradle to skip its own Gradle User Home save/restore (and so
          # avoid the proprietary `enhanced` provider) while keeping its
          # non-caching functionality.
          cache-provider: external

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Missing secret GOOGLE_SERVICES_JSON_BASE64"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > androidApp/google-services.json

      - name: Decode release keystore
        env:
          TABAKPP_KEYSTORE_BASE64: ${{ secrets.TABAKPP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TABAKPP_KEYSTORE_BASE64" ]; then
            echo "Missing secret TABAKPP_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$TABAKPP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tabakpp-release.keystore"
          echo "TABAKPP_KEYSTORE_PATH=$RUNNER_TEMP/tabakpp-release.keystore" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        env:
          TABAKPP_KEYSTORE_PASSWORD: ${{ secrets.TABAKPP_KEYSTORE_PASSWORD }}
          TABAKPP_KEY_ALIAS: ${{ secrets.TABAKPP_KEY_ALIAS }}
          TABAKPP_KEY_PASSWORD: ${{ secrets.TABAKPP_KEY_PASSWORD }}
          TABAKPP_VERSION_NAME: ${{ needs.require-ci.outputs.release_version }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Stage release artifact
        run: |
          mkdir -p dist
          APK_PATH=$(find androidApp/build/outputs/apk/release -name "*release*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: No signed release APK found in androidApp/build/outputs/apk/release/"
            exit 1
          fi
          VERSION="$RELEASE_VERSION"
          cp "$APK_PATH" "dist/tabakpp-${VERSION}.apk"

      # Verify the APK signature using SDK apksigner BEFORE generating checksum or publishing.
      - name: Verify the APK signature
        run: |
          VERSION="$RELEASE_VERSION"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "Error: apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "dist/tabakpp-${VERSION}.apk"

      - name: Generate artifact checksum
        run: |
          VERSION="$RELEASE_VERSION"
          cd dist
          sha256sum "tabakpp-${VERSION}.apk" > "tabakpp-${VERSION}.apk.sha256"
          cd ..

      - name: Verify release notes file exists
        run: |
          VERSION="$RELEASE_VERSION"
          if [ ! -f ".github/release-notes/v${VERSION}.md" ]; then
            echo "Error: Release notes file .github/release-notes/v${VERSION}.md not found."
            echo "Create release notes before publishing v${VERSION}."
            exit 1
          fi

      # Create the version tag ONLY after the APK builds and passes signature
      # verification AND the release notes file exists. If signing or build or
      # notes validation fails, no tag is created.
      - name: Create annotated version tag
        run: |
          VERSION="$RELEASE_VERSION"
          RELEASE_SHA=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" "${RELEASE_SHA}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.require-ci.outputs.release_version }}
          body_path: .github/release-notes/v${{ needs.require-ci.outputs.release_version }}.md
          files: |
            dist/tabakpp-${{ needs.require-ci.outputs.release_version }}.apk
            dist/tabakpp-${{ needs.require-ci.outputs.release_version }}.apk.sha256
          fail_on_unmatched_files: true

      - name: Cleanup decoded credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/tabakpp-release.keystore"
          rm -f androidApp/google-services.json
