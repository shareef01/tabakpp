version: 2
updates:
  # Web app dependencies (webApp/package.json).
  - package-ecosystem: "npm"
    directory: "/webApp"
    schedule:
      interval: "monthly"
    ignore:
      # firebase 13 and @firebase/rules-unit-testing 6 require Node >= 24.12.0,
      # but CI and release pin Node 22.23.2. They are also a peer-locked pair
      # (rules-unit-testing 6 peers firebase ^13) split across the two groups
      # below, so each group PR fails `npm ci` with ERESOLVE. Remove this
      # ignore when the toolchain moves to Node 24 and bump both in one PR.
      - dependency-name: "firebase"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@firebase/rules-unit-testing"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    open-pull-requests-limit: 3

  # Cloud Functions dependencies (functions/package.json).
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "monthly"
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    open-pull-requests-limit: 3

  # Kotlin/Android/Gradle dependencies (gradle/libs.versions.toml).
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      gradle-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # GitHub Actions — keeps SHA-pinned `uses:` refs in all three workflows
  # (CI, instrumentation, and release) current. Dependabot updates the pin AND
  # the trailing `# vX` comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
