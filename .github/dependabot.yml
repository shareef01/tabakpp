version: 2
updates:
  # Web app dependencies (webApp/package.json).
  - package-ecosystem: "npm"
    directory: "/webApp"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
    open-pull-requests-limit: 10

  # Kotlin/Android/Gradle dependencies (gradle/libs.versions.toml).
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions — keeps the SHA-pinned `uses:` refs in ci.yml and
  # release-android.yml current (item 20). Dependabot updates the pin AND
  # the trailing `# vX` comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
